# Community product-documentation requests.
#
# Visibility on /help-document/ is automatic, driven by two counters you
# update as things happen -- no page edits, no manually opening/closing:
#
#   units_given      bump by 1 when you post a unit out for this request
#   units_fulfilled   bump by 1 when that person's info actually comes back
#
# A request is shown only while status: open AND
# (units_given - units_fulfilled) < max_outstanding -- i.e. it auto-hides
# once too many are out awaiting feedback, and auto-reopens the moment one
# gets fulfilled. status: closed force-closes it regardless of the count,
# for retiring a request permanently.
#
# slug must match the product's file name in _products/ (without .md).
#
# Each `wanted` entry is either a plain string, or an object with:
#   label   the text shown on the card / put in the email
#   guide   (optional) id of an entry in _data/measurement_guides.yml --
#           when present, the card item becomes a clickable disclosure with
#           tools-needed + step-by-step instructions for that measurement.

