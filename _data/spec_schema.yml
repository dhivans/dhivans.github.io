# Reference schema for the `specs:` map in each _products front matter file.
#
# The 4 shop categories (electrical-components, tools, mechanical-components,
# test-equipment) are too broad to compare meaningfully — electrical-components
# alone covers diodes, dev boards, LED strips and adhesive tape. This groups the
# 45 catalogue products by what they actually are, so two items in the same
# group share the same spec keys and the compare table's diff-highlighting
# (compare.md) actually lines values up instead of showing "—" for everything.
#
# How to use: pick a product's group below, add a `specs:` map to its front
# matter using exactly these keys, e.g.
#   specs:
#     voltage_rating: "1000V"
#     current_rating: "1A"
#     package: "DO-41"
#
# Groups with only one product today still get a field set defined, so the
# next similar product added to the catalogue slots in with comparable specs
# from day one.

discrete-semiconductors:
  label: Diodes & Transistors
  products:
    - 1n4007-rectifier-diode-1000v-1a-high-voltage-electronic-component
    - 2n2222-npn-transistor-to-92-package-30v-800ma-linear-amplification-and-switching
  fields:
    - key: package
      label: Package
      type: text
    - key: voltage_rating
      label: Voltage Rating
      type: text
      unit: V
    - key: current_rating
      label: Current Rating
      type: text
      unit: A
    - key: power_rating
      label: Power Rating
      type: text
      unit: W

